[project]
name = "flump"
version = "0.1.1"
description = "Free open-source yt-dlp front-end for Mac. Paste a page link and save the video. A Downie alternative."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "yt-dlp[default]>=2025.1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
flump = "flump.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flump = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
